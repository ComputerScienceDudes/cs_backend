{% extends "layouts/base.html" %}
{% set project = "Login" %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
{% endblock %}

{% block body %}
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="{{ url_for('static', filename='assets/dad.png') }}" alt="D.A.D. Logo">
      <h1>D.A.D. Portal</h1>
      <p>Doing Exceptional Deeds</p>
    </div>

    <form name="f" action="{{ url_for('login') }}" method="POST" class="login-form">
      {% if error %}
      <div class="alert-error">Invalid username or password. Please try again.</div>
      {% endif %}

      <div class="form-group">
        <label for="username">User ID</label>
        <input id="username" name="username" type="text" required placeholder="Enter your user ID" class="ocs__input medium">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required placeholder="Enter your password" class="ocs__input medium">
      </div>

      <input type="hidden" name="next" value="{{ next }}" class="hidden-input">
      <button type="submit" class="ocs__btn fill submit-btn">Sign In</button>
    </form>

    <div class="login-footer">
      A 501(c)(3) Nonprofit &nbsp;|&nbsp; <a href="https://www.doingexceptionaldeeds.org" target="_blank">doingexceptionaldeeds.org</a>
    </div>
  </div>
</div>
{% endblock %}
