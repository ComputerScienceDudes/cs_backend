{% extends "layouts/base.html" %}
{% set project = "Home" %}

{% block style %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
{% endblock %}

{% block body %}
    <div class="dashboard-container">
        <div class="welcome-section">
            <div class="welcome-header">
                <h1>Dashboard</h1>
                <p class="ocs_lead">System overview and statistics</p>
            </div>
            <button id="refreshBtn" class="ocs__btn fill refresh-btn" title="Refresh statistics">
                <i class="fas fa-sync-alt"></i>
                <span>Refresh</span>
            </button>
        </div>

        <section class="ocs__card" aria-labelledby="display-title">
            <h2 id="display-title" class="ocs_section-title">Dashboard display</h2>
            <div class="ocs__links">
                <label class="ocs__toggle ocs__toggle--green"><input type="checkbox" class="ocs__toggle-input" id="display-details" checked><span class="ocs__toggle-track" aria-hidden="true"></span><span class="ocs__toggle-label">Show system information</span></label>
                <label class="ocs__toggle ocs__toggle--green"><input type="checkbox" class="ocs__toggle-input" id="display-compact" ><span class="ocs__toggle-track" aria-hidden="true"></span><span class="ocs__toggle-label">Compact cards</span></label>
                <label class="ocs__toggle ocs__toggle--green"><input type="checkbox" class="ocs__toggle-input" id="display-motion" ><span class="ocs__toggle-track" aria-hidden="true"></span><span class="ocs__toggle-label">Reduce motion</span></label>
            </div>
            <p id="display-count" class="ocs_description" aria-live="polite"></p>
        </section>
        <div id="stats-container" aria-live="polite" class="loading">
            <p>Loading statistics...</p>
        </div>
    </div>

    <script>
        // Checkbox state controls real display features, including asynchronously loaded content.
        function applyDisplayPreferences() {
            const details = document.getElementById('display-details');
            const info = document.getElementById('system-information');
            if (info) info.hidden = !details.checked;
            document.body.classList.toggle('compact-cards', document.getElementById('display-compact').checked);
            document.body.classList.toggle('reduce-motion', document.getElementById('display-motion').checked);
            const enabled = document.querySelectorAll('.ocs__toggle-input:checked').length;
            document.getElementById('display-count').textContent = `${enabled} of 3 display options enabled`;
        }
        // Keep the OS motion preference as the initial value, while allowing a page override.
        document.getElementById('display-motion').checked = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.querySelectorAll('.ocs__toggle-input').forEach(input => input.addEventListener('change', applyDisplayPreferences));
        applyDisplayPreferences();
        // Fetch and display dashboard statistics
        async function loadDashboardStats() {
            try {
                const response = await fetch('/api/dashboard/stats');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    const data = result.data;
                    const statsHTML = `
                        <div class="ocs__grid ocs__grid--card">
                            <div class="stat-card ocs__grid-cell">
                                <div class="stat-card-header">
                                    <div class="stat-card-icon">
                                        <i class="fas fa-users"></i>
                                    </div>
                                </div>
                                <h2 class="stat-card-title ocs_section-title">Total Users</h2>
                                <p class="stat-card-value">${data.total_users}</p>
                                <p class="stat-card-subtitle ocs_description">${data.admin_users} admins</p>
                            </div>

                            <div class="stat-card ocs__grid-cell">
                                <div class="stat-card-header">
                                    <div class="stat-card-icon">
                                        <i class="fas fa-file-upload"></i>
                                    </div>
                                </div>
                                <h2 class="stat-card-title ocs_section-title">Submissions</h2>
                                <p class="stat-card-value">${data.total_submissions}</p>
                                <p class="stat-card-subtitle ocs_description">All time</p>
                            </div>

                            <div class="stat-card ocs__grid-cell">
                                <div class="stat-card-header">
                                    <div class="stat-card-icon">
                                        <i class="fas fa-database"></i>
                                    </div>
                                </div>
                                <h2 class="stat-card-title ocs_section-title">Data Used</h2>
                                <p class="stat-card-value">${data.database_size_mb}</p>
                                <p class="stat-card-subtitle ocs_description">MB</p>
                            </div>

                            <div class="stat-card ocs__grid-cell">
                                <div class="stat-card-header">
                                    <div class="stat-card-icon">
                                        <i class="fas fa-server"></i>
                                    </div>
                                </div>
                                <h2 class="stat-card-title ocs_section-title">System Status</h2>
                                <p class="stat-card-value">
                                    <span class="status-indicator"></span>
                                    <span class="success-badge">${data.system_status}</span>
                                </p>
                                <p class="stat-card-subtitle ocs_description">All systems operational</p>
                            </div>
                        </div>

                        <div class="info-section ocs__card" id="system-information">
                            <h2><i class="fas fa-info-circle"></i> System Information</h2>
                            <ul class="info-list">
                                <li>
                                    <span class="info-label">Last Activity</span>
                                    <span class="info-value">${new Date(data.last_activity).toLocaleString()}</span>
                                </li>
                                <li>
                                    <span class="info-label">Last User ID Created</span>
                                    <span class="info-value">${data.last_user_id}</span>
                                </li>
                                <li>
                                    <span class="info-label">Database Integrity</span>
                                    <span class="info-value"><span class="success-badge">Healthy</span></span>
                                </li>
                            </ul>
                        </div>
                    `;
                    
                    document.getElementById('stats-container').classList.remove('loading');
                    document.getElementById('stats-container').innerHTML = statsHTML;
                    applyDisplayPreferences();
                } else {
                    throw new Error(result.message || 'Failed to load statistics');
                }
            } catch (error) {
                console.error('Error loading dashboard stats:', error);
                document.getElementById('stats-container').innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong> Failed to load dashboard statistics. Please try refreshing the page.
                    </div>
                `;
            }
        }

        // Handle refresh button click
        function setupRefreshButton() {
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', async function() {
                    this.disabled = true;
                    this.setAttribute('aria-busy', 'true');
                    await loadDashboardStats();
                    this.disabled = false;
                    this.removeAttribute('aria-busy');
                });
            }
        }

        // Load stats when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardStats();
            setupRefreshButton();
        });
    </script>
{% endblock %}
